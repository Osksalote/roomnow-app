<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/roomnow-app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="NamStay: find an available room in any town in Namibia, see the price and book in a minute.">
  <meta name="theme-color" content="#0E6A6C">
  <!-- iPhone: "Add to Home Screen" opens it like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NamStay">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <!-- Start connecting early (faster first opening on slow internet) -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://rgialahzshpnareeizzk.supabase.co" crossorigin>
  <link rel="preload" href="main.dart.js?v=0e986be1" as="script">
  <title>NamStay</title>
  <style>
    body{margin:0;background:#F3F4F2}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#0E6A6C}
    #splash img{width:84px;height:84px;border-radius:20px}
    #splash div{margin-top:14px;font-weight:700;font-size:18px}
    #splash small{margin-top:6px;color:#4A514E}
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""><div>NamStay</div><small>Loading…</small><small id="slow" style="display:none;max-width:280px;text-align:center">Slow internet: only the first opening takes longer. After that NamStay opens at once, even with weak signal.</small></div>
  <script>
    window.addEventListener('flutter-first-frame', function(){ var s=document.getElementById('splash'); if(s) s.remove(); });
    setTimeout(function(){ var s=document.getElementById('slow'); if(s) s.style.display='block'; }, 6000);
    // Keep a copy of the app on this device so it opens fast next time (not on the test server on this computer).
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
      navigator.serviceWorker.register('app_sw.js', { scope: './' }).catch(function(){});
    }
  </script>
  <script src="push.js"></script>
  <script src="flutter_bootstrap.js?v=0e986be1" async></script>
</body>
</html>
